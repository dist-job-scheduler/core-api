name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: europe-west3-docker.pkg.dev/notifylm/dist-scheduler

jobs:
  build-and-push:
    name: Build & Push Images
    needs: []  # Deploy only runs on main push, CI runs separately
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        include:
          - image: server
            dockerfile: Dockerfile.server
          - image: scheduler
            dockerfile: Dockerfile.scheduler
          - image: migrate
            dockerfile: Dockerfile.migrate

    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west3-docker.pkg.dev --quiet

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:latest
            ${{ env.REGISTRY }}/${{ matrix.image }}:sha-${{ github.sha }}

  deploy:
    name: Deploy to k3s
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Checkout infra repo
        uses: actions/checkout@v5
        with:
          repository: dist-job-scheduler/infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Set up kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install SOPS
        run: |
          curl -LO https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64
          chmod +x sops-v3.9.4.linux.amd64
          sudo mv sops-v3.9.4.linux.amd64 /usr/local/bin/sops

      - name: Decrypt secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          sops --decrypt --in-place infra/k8s/secrets.yaml
          sops --decrypt --in-place infra/k8s/monitoring/secrets.yaml

      - name: Apply monitoring stack
        run: |
          kubectl apply -f infra/k8s/monitoring/namespace.yaml
          kubectl apply -f infra/k8s/monitoring/secrets.yaml
          kubectl apply -f infra/k8s/monitoring/traefik-metrics.yaml
          kubectl apply -f infra/k8s/monitoring/prometheus.yaml
          kubectl apply -f infra/k8s/monitoring/loki.yaml
          kubectl apply -f infra/k8s/monitoring/promtail.yaml
          kubectl apply -f infra/k8s/monitoring/grafana.yaml
          kubectl apply -f infra/k8s/monitoring/ingress.yaml
          kubectl apply -f infra/k8s/monitoring/alerting-rules.yaml
          kubectl apply -f infra/k8s/monitoring/alertmanager.yaml

      - name: Apply manifests
        run: |
          kubectl apply -f infra/k8s/namespace.yaml
          kubectl apply -f infra/k8s/configmap.yaml
          kubectl apply -f infra/k8s/secrets.yaml
          kubectl apply -f infra/k8s/postgres.yaml

      - name: Run migrations
        run: |
          kubectl delete job migrate -n dist-scheduler --ignore-not-found
          kubectl apply -f infra/k8s/migrate-job.yaml
          kubectl wait --for=condition=Complete job/migrate -n dist-scheduler --timeout=60s

      - name: Apply network policies
        run: kubectl apply -f infra/k8s/network-policies.yaml

      - name: Deploy application
        run: |
          kubectl apply -f infra/k8s/server.yaml
          kubectl apply -f infra/k8s/scheduler.yaml
          kubectl apply -f infra/k8s/ingress.yaml
          kubectl rollout restart deployment/server -n dist-scheduler
          kubectl rollout restart deployment/scheduler -n dist-scheduler

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/server -n dist-scheduler --timeout=120s
          kubectl rollout status deployment/scheduler -n dist-scheduler --timeout=120s
